<div class="app">
 <aside class="sidebar">
  <header class="mast"><div class="brand"><span class="brand-mark">▲</span> CHEONAN · FOREST ATLAS</div><h1>천안의 산,<br><em>길을 발견하다.</em></h1><p>도심의 낮은 숲부터 웅장한 산줄기까지<br>나에게 맞는 천안의 등산 명소를 찾아보세요.</p><div class="stats"><div class="stat"><strong id="totalCount">9</strong><span>산 명소</span></div><div class="stat"><strong>699m</strong><span>최고 고도</span></div></div></header>
  <div class="tools"><div class="search-wrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg><input id="search" class="search" type="search" autocomplete="off" placeholder="산 이름이나 지역 검색" aria-label="산 검색"></div><div class="filters" role="group" aria-label="난이도 필터"><button class="chip active" data-filter="all">전체</button><button class="chip" data-filter="easy">🌿 가볍게</button><button class="chip" data-filter="mid">🥾 보통</button><button class="chip" data-filter="hard">⛰ 도전</button><button class="chip" data-filter="saved">♥ 즐겨찾기</button></div></div>

 <main class="map-area"><div id="map" aria-label="천안 주요 산 위치 지도"></div><div class="map-top"><div class="eyebrow"><b>CHUNGCHEONGNAM-DO · CHEONAN</b><span>● 주요 산 위치 안내 · 등산로 실측 지도 아님</span></div><div class="map-actions"><button id="layerToggle" class="action-btn" title="지도 유형 변경">◈ 지형 지도</button><button id="resetView" class="action-btn" title="천안 전체 보기">↗ 전체 보기</button></div></div><div class="legend"><span><i class="legend-dot"></i>가볍게</span><span><i class="legend-dot mid"></i>보통</span><span><i class="legend-dot hard"></i>도전</span></div><section class="detail hidden" id="detail" aria-live="polite"><button class="close-detail" id="closeDetail" aria-label="상세 정보 닫기">×</button><div class="detail-brow">MOUNTAIN GUIDE · 천안</div><h2 id="detailName"></h2><p id="detailDesc"></p><div class="detail-grid"><div class="info-box"><span>산 높이</span><b id="detailAlt"></b></div><div class="info-box"><span>산행 성격</span><b id="detailLevel"></b></div><div class="info-box" style="grid-column:1/-1"><span>추천 탐방 거점</span><b id="detailStart"></b></div></div><div class="detail-buttons"><a id="naverLink" class="primary-link" target="_blank" rel="noopener noreferrer">네이버 지도에서 찾기 ↗</a><a id="kakaoLink" class="secondary-link" target="_blank" rel="noopener noreferrer">카카오맵 ↗</a></div><div class="detail-note">※ 지도 표시는 산 일대의 참고 위치입니다. 실제 등산로·입산 통제·난이도는 현지 안내를 확인하세요.</div></section></main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
// 주요 산의 표시 좌표는 대표 지역을 나타내는 참고 위치이며 정밀 정상 GPS 좌표가 아닙니다.
const mountains=[
 {id:'gwangdeok',name:'광덕산',alt:699,lat:36.685,lng:127.045,region:'동남구 광덕면',level:'hard',label:'도전',theme:'계곡 · 사찰',start:'광덕사 일대',desc:'천안 남서쪽의 대표적인 명산입니다. 광덕사와 계곡 풍경을 함께 즐길 수 있으며, 오르막 구간에 대비한 산행 준비가 필요합니다.'},
 {id:'taejo',name:'태조산',alt:419,lat:36.823,lng:127.200,region:'동남구 안서동·유량동',level:'easy',label:'가볍게',theme:'도심 숲 · 역사',start:'각원사·태조산공원 일대',desc:'시내에서 접근하기 좋은 숲길 명소입니다. 각원사와 태조산공원을 연계해 여유로운 숲 나들이를 즐기기 좋습니다.'},
 {id:'heukseong',name:'흑성산',alt:518,lat:36.787,lng:127.232,region:'동남구 목천읍',level:'mid',label:'보통',theme:'전망 · 역사',start:'독립기념관 일대',desc:'독립기념관과 인접한 산으로 흑성산성과 조망으로 알려져 있습니다. 구간에 따라 경사가 있으니 현지 이정표를 확인하세요.'},
 {id:'seonggeo',name:'성거산',alt:573,lat:36.904,lng:127.193,region:'서북구 성거읍',level:'mid',label:'보통',theme:'능선 · 산성',start:'성거산성 일대',desc:'천안 북부의 산줄기를 이루는 산으로 성거산성과 연계한 역사·자연 탐방을 계획할 수 있습니다.'},
 {id:'wirye',name:'위례산',alt:523,lat:36.942,lng:127.201,region:'서북구 입장면',level:'mid',label:'보통',theme:'산성 · 능선',start:'위례산성 일대',desc:'천안 북쪽 경계권의 능선 산행지입니다. 위례산성의 역사적 흔적과 숲의 풍경을 함께 찾아볼 수 있습니다.'},
 {id:'taehak',name:'태학산',alt:461,lat:36.735,lng:127.081,region:'동남구 풍세면',level:'easy',label:'가볍게',theme:'자연휴양림 · 숲',start:'태학산자연휴양림 일대',desc:'자연휴양림과 연계해 숲을 가까이 만날 수 있는 산입니다. 가족 단위 산림휴양과 산책을 함께 계획하기 좋습니다.'},
 {id:'eunseok',name:'은석산',alt:455,lat:36.852,lng:127.285,region:'동남구 북면·병천면',level:'mid',label:'보통',theme:'사찰 · 숲길',start:'은석사 일대',desc:'북면과 병천면 일대에 걸친 숲 산행지입니다. 은석사 주변 탐방을 함께 고려해 볼 수 있습니다.'},
 {id:'jakseong',name:'작성산',alt:503,lat:36.867,lng:127.246,region:'동남구 북면·병천면',level:'hard',label:'도전',theme:'종주 · 능선',start:'북면 일대 등산로 입구 확인',desc:'천안 북동부 산줄기의 일부로 종주형 산행과 연계되는 산입니다. 들머리와 코스 현황을 미리 확인하는 것이 좋습니다.'},
 {id:'bongseo',name:'봉서산',alt:158,lat:36.802,lng:127.119,region:'서북구 쌍용동·불당동',level:'easy',label:'가볍게',theme:'도심 · 산책',start:'쌍용동·불당동 인근 숲길',desc:'천안 도심 가까이에서 짧게 숲을 만날 수 있는 낮은 산입니다. 일상적인 가벼운 산책에 적합합니다.'}
];
const levelClasses={easy:'',mid:'mid',hard:'hard'};
const map=L.map('map',{zoomControl:false,scrollWheelZoom:true}).setView([36.823,127.16],11);
L.control.zoom({position:'bottomright'}).addTo(map);
const street=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap contributors'});
const terrain=L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:17,attribution:'&copy; OpenTopoMap &copy; OpenStreetMap contributors'});
street.addTo(map);let topographic=false;
let filter='all',query='',selected=null;const markers=new Map(),saved=new Set();
try{JSON.parse(localStorage.getItem('cheonan-mountain-favorites')||'[]').forEach(id=>saved.add(id))}catch(e){}
const clean=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
function iconFor(m,active=false){return L.divIcon({className:'pin-wrap',html:`<div class="pin ${levelClasses[m.level]} ${active?'active':''}"><b>▲</b></div>`,iconSize:[42,42],iconAnchor:[20,38]})}
mountains.forEach(m=>{const marker=L.marker([m.lat,m.lng],{icon:iconFor(m)}).addTo(map);marker.bindTooltip(`${m.name} · ${m.alt}m`,{direction:'top',offset:[0,-27],className:'mountain-tooltip'});marker.on('click',()=>selectMountain(m.id));markers.set(m.id,marker)});
function visible(m){return (filter==='all'||(filter==='saved'?saved.has(m.id):m.level===filter))&&(!query||(m.name+' '+m.region+' '+m.theme).includes(query))}
function render(){const shown=mountains.filter(visible);document.getElementById('resultCount').textContent=shown.length+'개 명소';const list=document.getElementById('mountains');list.innerHTML=shown.length?shown.map((m)=>`<div class="mountain-card ${selected===m.id?'selected':''}" role="listitem" tabindex="0" data-id="${m.id}"><div class="number">${String(mountains.indexOf(m)+1).padStart(2,'0')}</div><div class="mountain-main"><div class="mountain-title"><span>${clean(m.name)}</span><span class="height">${m.alt}m</span></div><div class="mountain-sub">${clean(m.region)}</div><div class="mountain-bottom"><span class="tag ${levelClasses[m.level]}">${m.label}</span><span class="tag">${clean(m.theme)}</span></div></div><button class="heart ${saved.has(m.id)?'saved':''}" aria-label="${m.name} 즐겨찾기" data-favorite="${m.id}">${saved.has(m.id)?'♥':'♡'}</button></div>`).join(''):'<div class="empty">조건에 맞는 산이 없어요.<br>다른 검색어나 필터를 선택해 보세요.</div>';
list.querySelectorAll('.mountain-card').forEach(el=>{el.addEventListener('click',e=>{if(!e.target.closest('.heart'))selectMountain(el.dataset.id)});el.addEventListener('keydown',e=>{if(e.key==='Enter')selectMountain(el.dataset.id)})});list.querySelectorAll('.heart').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();const id=el.dataset.favorite;saved.has(id)?saved.delete(id):saved.add(id);try{localStorage.setItem('cheonan-mountain-favorites',JSON.stringify([...saved]))}catch(err){}render()}));
mountains.forEach(m=>{const marker=markers.get(m.id);if(visible(m)){if(!map.hasLayer(marker))marker.addTo(map)}else if(map.hasLayer(marker))map.removeLayer(marker);marker.setIcon(iconFor(m,selected===m.id))});}
function selectMountain(id){const m=mountains.find(v=>v.id===id);if(!m)return;selected=id;document.getElementById('detailName').innerHTML=`${clean(m.name)} <small>${m.alt}m</small>`;document.getElementById('detailDesc').textContent=m.desc;document.getElementById('detailAlt').textContent=m.alt+'m';document.getElementById('detailLevel').textContent=m.label+' · '+m.theme;document.getElementById('detailStart').textContent=m.start;document.getElementById('naverLink').href='https://map.naver.com/p/search/'+encodeURIComponent('천안 '+m.name+' 등산로');document.getElementById('kakaoLink').href='https://map.kakao.com/?q='+encodeURIComponent('천안 '+m.name+' 등산로');document.getElementById('detail').classList.remove('hidden');const z=Math.max(map.getZoom(),12);map.flyTo([m.lat,m.lng],z,{animate:true,duration:.7});render();if(window.innerWidth<=700){const card=document.querySelector(`.mountain-card[data-id="${id}"]`);card?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});setTimeout(()=>map.invalidateSize(),200)}}
function reset(){selected=null;document.getElementById('detail').classList.add('hidden');map.fitBounds(L.latLngBounds(mountains.map(m=>[m.lat,m.lng])).pad(.15),{animate:true,maxZoom:11});render()}
document.getElementById('search').addEventListener('input',e=>{query=e.target.value.trim();render()});document.querySelectorAll('.chip').forEach(el=>el.addEventListener('click',()=>{filter=el.dataset.filter;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===el));render()}));document.getElementById('closeDetail').addEventListener('click',()=>{selected=null;document.getElementById('detail').classList.add('hidden');render()});document.getElementById('resetView').addEventListener('click',reset);document.getElementById('layerToggle').addEventListener('click',e=>{if(topographic){map.removeLayer(terrain);street.addTo(map)}else{map.removeLayer(street);terrain.addTo(map)}topographic=!topographic;e.currentTarget.classList.toggle('on',topographic);e.currentTarget.textContent=topographic?'▦ 일반 지도':'◈ 지형 지도'});
render();map.fitBounds(L.latLngBounds(mountains.map(m=>[m.lat,m.lng])).pad(.13),{maxZoom:11,animate:false});window.addEventListener('resize',()=>setTimeout(()=>map.invalidateSize(),120));
</script>
</body></html>
